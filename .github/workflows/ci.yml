name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/core-api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B spotless:check test
  intelligence-api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/intelligence-api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pip-audit
      - run: pip-audit -r <(python -c "import tomllib; print('\\n'.join(tomllib.load(open('services/intelligence-api/pyproject.toml','rb'))['project']['dependencies']))")
        shell: bash
      - run: npm audit --omit=dev
        working-directory: apps/web
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
