spring:
  application:
    name: enqivra-core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enqivra}
    username: ${DB_USER:enqivra}
    password: ${DB_PASSWORD:enqivra_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL:INFO}
