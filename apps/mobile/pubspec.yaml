name: enqivra_mobile
description: ENQIVRA mobile application shell
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.2.1
  http: ^1.5.0
  file_picker: ^10.3.3
  image_picker: ^1.2.1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  circular_theme_reveal: ^1.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/branding/enquivra_logo.png

# Generates the real app icon (Android mipmaps + adaptive icon) from the
# ENQIVRA logo, replacing the default Flutter launcher icon everywhere.
# Run locally after `flutter pub get`:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/branding/enquivra_logo.png"
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/branding/enquivra_logo.png"
  min_sdk_android: 21
