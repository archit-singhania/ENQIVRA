spring:
  datasource:
    url: "jdbc:h2:mem:enqivra;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=KEY,VALUE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
enqivra:
  security:
    jwt-secret: a-development-test-secret-that-is-long-enough
  storage:
    evidence-directory: ./target/test-evidence
