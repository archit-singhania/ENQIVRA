spring:
  application:
    name: enqivra-core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enqivra}
    username: ${DB_USER:enqivra}
    password: ${DB_PASSWORD:enqivra_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
enqivra:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-before-production-use}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  storage:
    evidence-directory: ${EVIDENCE_STORAGE_PATH:./data/evidence}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL:INFO}
