name: ${COMPOSE_PROJECT_NAME:-enqivra}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enqivra}
      POSTGRES_USER: ${POSTGRES_USER:-enqivra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enqivra_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:2025.08-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-enqivra_dev_only}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  core-api:
    build:
      context: ./services/core-api
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-enqivra}
      DB_USER: ${POSTGRES_USER:-enqivra}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-enqivra_dev_only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-production-use}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      EVIDENCE_STORAGE_PATH: /data/evidence
    volumes:
      - evidence_data:/data/evidence
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  intelligence-api:
    build:
      context: ./services/intelligence-api
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-enqivra}:${POSTGRES_PASSWORD:-enqivra_dev_only}@postgres:5432/${POSTGRES_DB:-enqivra}
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-enqivra_dev_only}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      INTELLIGENCE_DATA_PATH: /data/intelligence.db
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-production-use}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      ENFORCE_CORE_OWNERSHIP: ${ENFORCE_CORE_OWNERSHIP:-true}
      CORE_API_URL: http://core-api:8080/api/v1
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - intelligence_data:/data
    ports:
      - "${INTELLIGENCE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  valkey_data:
  evidence_data:
  intelligence_data:
